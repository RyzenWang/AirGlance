version: 2
updates:
  # NuGet: central package versions live in Directory.Packages.props, so one pull
  # request covers the whole solution.
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    groups:
      # Avalonia's packages have to move together. A major upgrade that lands one package
      # at 12.x and leaves the others at 11.x cannot build, and the default grouping (one
      # pull request per package pair, majors ungrouped) produced four unmergeable
      # requests during the 12.2.0 bump. Listed first because the first matching group
      # wins, so Avalonia never lands in the catch-all minor group either.
      avalonia:
        patterns:
          - "Avalonia*"
        update-types:
          - "major"
          - "minor"
          - "patch"
      nuget-minor:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # GitHub Actions: the workflows pin major tags today, so Dependabot keeps the
  # versions current until they are pinned by SHA.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns:
          - "*"
