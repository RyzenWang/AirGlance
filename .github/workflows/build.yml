name: Build

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"

jobs:
  build:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - ubuntu-latest
          - macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', 'Directory.Packages.props', 'global.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Cache the native AVIF build
        uses: actions/cache@v6
        with:
          path: |
            native/avif/.cache
            native/avif/bin
          key: avif-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('native/avif/build.ps1', 'native/avif/build.sh', 'native/avif/build-win-arm64.ps1', 'native/avif/airglance_avif.c', 'native/avif/airglance_avif.h') }}
          restore-keys: |
            avif-${{ runner.os }}-${{ runner.arch }}-

      - name: Install AVIF build dependencies (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install nasm -y --no-progress
          choco install llvm -y --no-progress
          python -m pip install --user meson==1.7.2

      - name: Build AVIF decoder (Windows x64)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./native/avif/build.ps1 -NasmDirectory "C:\Program Files\NASM"

      - name: Build AVIF decoder (Windows arm64)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./native/avif/build-win-arm64.ps1

      - name: Install AVIF build dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install meson

      - name: Build AVIF decoder (macOS)
        if: runner.os == 'macOS'
        run: bash native/avif/build.sh

      - name: Install AVIF build dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build meson
          if [[ "$(uname -m)" == "x86_64" ]]; then
            sudo apt-get install -y --no-install-recommends nasm
          fi

      - name: Build AVIF decoder (Linux)
        if: runner.os == 'Linux'
        run: bash native/avif/build.sh

      - name: Verify the AVIF decoder exists
        shell: bash
        run: |
          # Without this, every AVIF test returns early and the suite goes green
          # while testing nothing. Fail loudly instead. The shared library carries
          # a lib prefix on macOS and Linux, the Windows one does not.
          decoder=$(find native/avif/bin -type f \
            \( -name 'airglance_avif.dll' -o -name 'libairglance_avif.dylib' -o -name 'libairglance_avif.so' \) \
            -print -quit)
          if [[ -z "$decoder" ]]; then
            echo "::error::The AVIF decoder was not built, so the AVIF tests would silently pass."
            exit 1
          fi
          echo "Decoder: $decoder"
          ls -l "$(dirname "$decoder")"

      - name: Restore
        run: dotnet restore AirGlance.sln

      - name: Build
        run: dotnet build AirGlance.sln -c Release --no-restore

      - name: Test
        run: dotnet test AirGlance.sln -c Release --no-build --logger console --logger trx --results-directory artifacts/test-results

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.os }}
          path: artifacts/test-results
          if-no-files-found: warn
          retention-days: 14
