name: Store MSIX

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"

jobs:
  msix:
    name: Build and inspect MSIX
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', 'Directory.Packages.props', 'global.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Cache the native AVIF build
        uses: actions/cache@v6
        with:
          path: |
            native/avif/.cache
            native/avif/bin
          key: avif-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('native/avif/build.ps1', 'native/avif/build.sh', 'native/avif/build-win-arm64.ps1', 'native/avif/airglance_avif.c', 'native/avif/airglance_avif.h') }}
          restore-keys: |
            avif-${{ runner.os }}-${{ runner.arch }}-

      # Both versions are read from the files that own them: the application version
      # from Directory.Build.props, the Store package version from AppxManifest.xml.
      - name: Resolve versions
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $appVersion = & dotnet msbuild src/AirGlance.App/AirGlance.App.csproj -nologo -getProperty:Version
          if ($LASTEXITCODE -ne 0) {
            throw "dotnet msbuild could not read the application version."
          }

          $appVersion = ($appVersion | Where-Object { $_.Trim().Length -gt 0 } | Select-Object -Last 1).Trim()
          if ([string]::IsNullOrWhiteSpace($appVersion)) {
            throw "Directory.Build.props did not yield a Version."
          }

          [xml]$manifest = Get-Content packaging/msix/AppxManifest.xml -Raw
          $identity = $manifest.SelectSingleNode('/*[local-name()="Package"]/*[local-name()="Identity"]')
          if ($null -eq $identity) {
            throw "AppxManifest.xml has no Package/Identity element."
          }

          $storeVersion = $identity.GetAttribute("Version").Trim()
          if ([string]::IsNullOrWhiteSpace($storeVersion)) {
            throw "AppxManifest.xml declares no Identity@Version."
          }

          "APP_VERSION=$appVersion" >> $env:GITHUB_ENV
          "STORE_VERSION=$storeVersion" >> $env:GITHUB_ENV
          Write-Host "Application version:   $appVersion"
          Write-Host "Store package version: $storeVersion"

      - name: Install and build AVIF decoder
        shell: pwsh
        run: |
          choco install nasm -y --no-progress
          python -m pip install --user meson==1.7.2
          ./native/avif/build.ps1 -NasmDirectory "C:\Program Files\NASM"

      - name: Publish and pack x64
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          # This Store upload is x64-only. The ARM64 MSIX can be built and
          # now includes the ARM64 AVIF decoder, but it is not part of this
          # submission.
          $targets = @(
            [pscustomobject]@{ Architecture = "x64"; Runtime = "win-x64" }
          )

          foreach ($target in $targets) {
            $publishDir = Join-Path "publish" $target.Runtime
            Write-Host "Publishing AirGlance for $($target.Runtime)..."

            & dotnet publish "src/AirGlance.App/AirGlance.App.csproj" `
              -c Release `
              -r $target.Runtime `
              -p:PublishAot=true `
              -p:StripSymbols=true `
              -p:Version=$env:APP_VERSION `
              -o $publishDir

            if ($LASTEXITCODE -ne 0) {
              throw "dotnet publish failed for $($target.Runtime) with exit code $LASTEXITCODE."
            }

            Write-Host "Packing $($target.Architecture) MSIX..."
            & "./packaging/msix/Build-Msix.ps1" `
              -Version $env:STORE_VERSION `
              -Architecture $target.Architecture `
              -PublishDir $publishDir `
              -OutputDir "artifacts/msix"
          }

          Get-ChildItem "artifacts/msix" -Filter "*.msix" |
            ForEach-Object { Write-Host "Built: $($_.FullName) ($($_.Length) bytes)" }

      - name: Run WACK when available (informational for unsigned packages)
        shell: pwsh
        continue-on-error: true
        run: |
          $ErrorActionPreference = "Continue"
          $kitDir = 'C:\Program Files (x86)\Windows Kits\10\App Certification Kit'
          $appcert = $null
          if (Test-Path -LiteralPath $kitDir -PathType Container) {
            $appcert = Get-ChildItem -LiteralPath $kitDir -Filter "appcert.exe" -File -ErrorAction SilentlyContinue |
              Select-Object -First 1
          }

          if ($null -eq $appcert) {
            Write-Warning "Windows App Certification Kit (appcert.exe) was not found; skipping WACK."
            @(
              "### Windows App Certification Kit",
              "",
              "WACK was not available on this runner. No certification report was produced."
            ) | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            exit 0
          }

          $reportDir = Join-Path (Get-Location) "artifacts/msix/wack"
          New-Item -ItemType Directory -Path $reportDir -Force | Out-Null

          Write-Host "Resetting WACK..."
          & $appcert.FullName reset
          if ($LASTEXITCODE -ne 0) {
            Write-Warning "WACK reset exited with code $LASTEXITCODE."
          }

          $packages = @(Get-ChildItem "artifacts/msix" -Filter "*.msix" -File)
          if ($packages.Count -eq 0) {
            Write-Warning "No MSIX packages were found to inspect."
            exit 0
          }

          foreach ($package in $packages) {
            $reportPath = Join-Path $reportDir ("wack-{0}.xml" -f $package.BaseName)
            Write-Host "Running WACK for $($package.Name) (unsigned preflight; signature failures are expected)..."
            & $appcert.FullName test -appxpackagepath $package.FullName -reportoutputpath $reportPath
            if ($LASTEXITCODE -ne 0) {
              Write-Warning "WACK reported failures for $($package.Name) (exit code $LASTEXITCODE). This is expected for an unsigned package and the report is uploaded for review."
            }
            if (Test-Path -LiteralPath $reportPath -PathType Leaf) {
              Write-Host "WACK report: $reportPath"
            }
            else {
              Write-Warning "WACK did not produce a report for $($package.Name)."
            }
          }

          @(
            "### Windows App Certification Kit",
            "",
            "WACK ran against unsigned MSIX packages. Signature-related failures are expected.",
            'Reports are attached to the `airglance-msix` workflow artifact for manual review.',
            "Sign the packages with a trusted certificate before using them for Store certification."
          ) | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

          exit 0

      - name: Upload MSIX packages and WACK reports
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: airglance-msix
          path: |
            artifacts/msix/*.msix
            artifacts/msix/wack/*.xml
          if-no-files-found: error
          retention-days: 14

      # Partner Center submission is intentionally manual. This workflow only
      # produces unsigned packages for local review and WACK preflight.
