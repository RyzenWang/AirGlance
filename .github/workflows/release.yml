name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', 'Directory.Packages.props', 'global.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore AirGlance.sln

      - name: Build
        run: dotnet build AirGlance.sln -c Release --no-restore

      - name: Test
        run: dotnet test AirGlance.sln -c Release --no-build --logger console

  package:
    name: Package ${{ matrix.rid }}
    needs: test
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      # NativeAOT builds native machine code and cannot be cross-compiled between
      # OS families. macOS and Linux archives therefore use native runners of the
      # matching OS and architecture. Windows builds both Windows zips on
      # windows-latest.
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            platform: windows
            extension: zip
          - os: windows-latest
            rid: win-arm64
            platform: windows
            extension: zip
          - os: macos-15
            rid: osx-arm64
            platform: macos
            extension: zip
          - os: macos-15-intel
            rid: osx-x64
            platform: macos
            extension: zip
          - os: ubuntu-22.04
            rid: linux-x64
            platform: linux
            extension: tar.gz
          - os: ubuntu-24.04-arm
            rid: linux-arm64
            platform: linux
            extension: tar.gz

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', 'Directory.Packages.props', 'global.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Extract version from tag
        id: version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [[ -z "$version" ]]; then
            echo "::error::The tag must be v<version>, for example v0.1.0."
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install Linux NativeAOT and AVIF build dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang zlib1g-dev cmake ninja-build meson
          if [[ "$(uname -m)" == "x86_64" ]]; then
            sudo apt-get install -y --no-install-recommends nasm
          fi

      - name: Install AVIF build dependencies (macOS)
        if: matrix.platform == 'macos'
        run: |
          brew install meson
          if [[ "$(uname -m)" == "x86_64" ]]; then
            brew install nasm
          fi

      - name: Install AVIF build dependencies (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          choco install nasm -y --no-progress
          python -m pip install --user meson==1.7.2

      - name: Build portable Windows zip
        if: matrix.platform == 'windows'
        shell: pwsh
        run: ./packaging/scripts/pack.ps1 -Version $env:VERSION -Runtime '${{ matrix.rid }}' -Aot

      - name: Build macOS app or Linux archive
        if: matrix.platform != 'windows'
        shell: bash
        run: bash ./packaging/scripts/pack.sh "$VERSION" "${{ matrix.rid }}"

      - name: Upload release archive
        uses: actions/upload-artifact@v4
        with:
          name: AirGlance-${{ matrix.rid }}
          path: artifacts/AirGlance-*-${{ matrix.rid }}.${{ matrix.extension }}
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub Release
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download release archives
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Extract version from tag
        id: version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [[ -z "$version" ]]; then
            echo "::error::The tag must be v<version>, for example v0.1.0."
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Create SHA256SUMS.txt
        shell: bash
        run: |
          set -euo pipefail
          cd dist

          shopt -s nullglob
          archives=(AirGlance-*.zip AirGlance-*.tar.gz)
          shopt -u nullglob

          if (( ${#archives[@]} != 6 )); then
            echo "::error::Expected exactly 6 release archives, found ${#archives[@]}."
            ls -la
            exit 1
          fi

          if compgen -G "*.msix" > /dev/null; then
            echo "::error::MSIX packages must not be published by this workflow."
            exit 1
          fi

          mapfile -t archives < <(printf '%s\n' "${archives[@]}" | LC_ALL=C sort)
          sha256sum "${archives[@]}" > SHA256SUMS.txt
          echo "SHA256SUMS.txt:"
          cat SHA256SUMS.txt

      - name: Build release notes
        shell: bash
        run: |
          set -euo pipefail

          notes_file="$RUNNER_TEMP/airglance-release-notes.md"
          rm -f "$notes_file"
          source="tag message"
          notes_found=false

          if [[ -f CHANGELOG.md ]]; then
            # Match both "## [0.1.0] - date" and "## 0.1.0" headings.
            if awk -v wanted="$VERSION" '
              /^##[[:space:]]/ {
                if (capture) {
                  exit
                }
                header = $0
                sub(/^##[[:space:]]+/, "", header)
                sub(/^\[/, "", header)
                sub(/\].*$/, "", header)
                sub(/[[:space:]].*$/, "", header)
                sub(/^v/, "", header)
                if (header == wanted) {
                  capture = 1
                  found = 1
                  print $0
                }
                next
              }
              capture {
                print
              }
              END {
                if (!found) {
                  exit 1
                }
              }
            ' CHANGELOG.md > "$notes_file"; then
              notes_found=true
              source="CHANGELOG.md"
            else
              rm -f "$notes_file"
            fi
          fi

          if [[ "$notes_found" != "true" ]]; then
            tag_message="$(git tag -l --format='%(contents)' "$GITHUB_REF_NAME")"
            if [[ -n "$tag_message" ]]; then
              printf '%s\n' "$tag_message" > "$notes_file"
              source="tag message"
            else
              printf 'AirGlance %s\n' "$VERSION" > "$notes_file"
              source="generated fallback because the tag has no message"
            fi
          fi

          if [[ ! -s "$notes_file" ]]; then
            echo "::error::Release notes are empty."
            exit 1
          fi

          echo "Release notes from: $source"
          cat "$notes_file"

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd dist

          shopt -s nullglob
          assets=(AirGlance-*.zip AirGlance-*.tar.gz SHA256SUMS.txt)
          shopt -u nullglob

          if (( ${#assets[@]} != 7 )); then
            echo "::error::Expected six archives plus SHA256SUMS.txt, found ${#assets[@]} files."
            ls -la
            exit 1
          fi

          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber
            gh release edit "$GITHUB_REF_NAME" \
              --title "AirGlance $VERSION" \
              --notes-file "$RUNNER_TEMP/airglance-release-notes.md"
          else
            gh release create "$GITHUB_REF_NAME" "${assets[@]}" \
              --verify-tag \
              --title "AirGlance $VERSION" \
              --notes-file "$RUNNER_TEMP/airglance-release-notes.md"
          fi
